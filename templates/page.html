{% extends "base.html" %}

{% block header %}
    <nav class="back">
      <a href="{{ config.base_url }}/">{{ config.title }}</a>
    </nav>
    <h1>{{ page.title }}</h1>
    <p class="author">{{ config.title }}</p>
{%- endblock header %}

{% block content %}
    {{ page.content | trim | safe }}
{%- endblock content %}
