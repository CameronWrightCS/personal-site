<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ config.title }}</title>
  <link rel="preload" href="{{ get_url(path='fonts/lmroman10-regular-subset.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
  <header>
    {%- block header %}{% endblock header %}
  </header>
  <main>
    {%- block content %}{% endblock content %}
  </main>
  <footer>
    <p>Set in Latin Modern, based on Donald E. Knuth’s Computer Modern.</p>
  </footer>
</body>
</html>
