name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: zola build
        uses: docker://ghcr.io/getzola/zola:v0.23.6
        with:
          args: build
      - name: zola check
        uses: docker://ghcr.io/getzola/zola:v0.23.6
        with:
          args: check

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # Publish to Pages
      id-token: write  # Prove the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency: pages # One deploy at a time
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
